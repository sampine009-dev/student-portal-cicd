
name: Student Portal CI-CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t student-portal:${{ github.sha }} .

      - name: Load Image into kind
        run: kind load docker-image student-portal:${{ github.sha }} --name student-lab

      - name: Deploy to Kubernetes
        run: kubectl set image deployment/student-portal student-portal=student-portal:${{ github.sha }}

      - name: Verify Deployment
        run: kubectl rollout status deployment/student-portal --timeout=120s

      - name: Verify Pods and Services
        run: |
          kubectl get pods -l app=student-portal
          kubectl get service student-portal


      - name: Stop Container
        if: always()
        run: docker rm -f portal-test || true

